var LB1=["Không thích","Hơi thích","Thích","Rất thích"],LB2=["Chưa tốt","Tạm được","Khá tốt","Rất tốt"];
var ST={step:0,a:{},s:[],miss:false};
var KEY='lb_quiz_v1';
function load(){try{var j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&j.a){ST.a=j.a;ST.s=j.s||[];}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({a:ST.a,s:ST.s}));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function qset(step){if(step===1)return {list:INT,from:0,to:9,pre:'i',lab:LB1,title:'Em thích làm việc này đến đâu?'};if(step===2)return {list:INT,from:9,to:18,pre:'i',lab:LB1,title:'Em thích làm việc này đến đâu?'};if(step===3)return {list:ABL,from:0,to:7,pre:'a',lab:LB2,title:'Em thấy mình làm việc này tốt đến đâu?'};return {list:ABL,from:7,to:14,pre:'a',lab:LB2,title:'Em thấy mình làm việc này tốt đến đâu?'};}
function qHtml(step){var q=qset(step),s='<h2>'+q.title+'</h2><p class="mut sm">Không có đáp án đúng hay sai. Em chọn theo cảm nhận thật của mình hiện nay.</p>';
for(var i=q.from;i<q.to;i++){var id=q.pre+i,v=ST.a[id];s+='<fieldset class="q'+(ST.miss&&!v?' miss':'')+'"><legend>'+(i+1)+'. '+esc(q.list[i][1])+'</legend><div class="opts">';
for(var k=1;k<=4;k++){s+='<label class="op"><input type="radio" name="'+id+'" value="'+k+'"'+(v===k?' checked':'')+'><span>'+q.lab[k-1]+'</span></label>';}
s+='</div></fieldset>';}return s;}
function stepOk(step){if(step>=1&&step<=4){var q=qset(step);for(var i=q.from;i<q.to;i++){if(!ST.a[q.pre+i])return false;}}return true;}
function compute(a,subs){var I={R:0,I:0,A:0,S:0,E:0,C:0},A={L:0,N:0,K:0,M:0,P:0,T:0,D:0};
INT.forEach(function(q,i){I[q[0]]+=(a['i'+i]||1)-1;});ABL.forEach(function(q,i){A[q[0]]+=(a['a'+i]||1)-1;});
Object.keys(I).forEach(function(t){I[t]=I[t]/9;});Object.keys(A).forEach(function(k){A[k]=A[k]/6;});
var res=G.map(function(g){var iF=0,aF=0,t;for(t in g.P)iF+=g.P[t]*I[t];for(t in g.A)aF+=g.A[t]*A[t];
var sF=null;if(subs.length){sF=0;subs.forEach(function(x){sF+=(SM[x]&&SM[x][g.id])||0;});sF/=subs.length;}
var tot=sF===null?.625*iF+.375*aF:.5*iF+.3*aF+.2*sF;return {g:g,i:iF,a:aF,s:sF,t:tot};}).sort(function(x,y){return y.t-x.t;});
return {I:I,A:A,res:res};}
function lv(x){return x>=.7?'Rất cao':x>=.5?'Khá cao':x>=.3?'Vừa':'Còn thấp';}
function bar(lbl,x){return '<div class="bar"><span>'+lbl+'</span><i><b style="width:'+Math.round(Math.max(.04,x)*100)+'%"></b></i><span>'+lv(x)+'</span></div>';}
function top2(o,names){return Object.keys(o).sort(function(x,y){return o[y]-o[x];}).slice(0,2).map(function(k){return names[k];}).join(' và ');}
function resultHtml(){var C=compute(ST.a,ST.s),R=C.res,s='';
s+='<h1>Kết quả của em</h1><p class="mut sm">Đây là gợi ý để em khám phá, dựa trên mô hình sở thích nghề nghiệp phổ biến và phần em tự đánh giá. Đây không phải bài kiểm tra chuẩn hóa và không kết luận em “nên” hay “không nên” làm gì. Em còn nhiều thời gian để thay đổi.</p>';
s+='<div class="card"><h2>Hồ sơ của em</h2><p>Em nổi bật về sở thích: <b>'+top2(C.I,TN)+'</b>.</p><p>Em tự thấy mạnh về năng lực: <b>'+top2(C.A,AN)+'</b>.</p>'+(ST.s.length?'<p>Môn em thích nhất: <b>'+ST.s.map(esc).join(', ')+'</b>.</p>':'')+'</div>';
if(R[0].t<.4)s+='<div class="note">Câu trả lời của em chưa thiên rõ về nhóm nào. Điều này rất bình thường ở lớp 10. Em thử làm một vài việc ở phần “Thử trong 2 tuần” rồi làm lại bài này sau.</div>';
s+='<h2>3 nhóm ngành gợi ý nhất</h2>';
R.slice(0,3).forEach(function(r,idx){var g=r.g,rk=r.t>=.65?['r1','Rất hợp']:r.t>=.5?['r2','Khá hợp']:['r3','Có thể thử'];
var gapNote='';if(r.i>=.6&&r.a<.45)gapNote='<div class="note">Em thích nhóm này nhưng năng lực tự đánh giá chưa cao. Năng lực rèn được: hãy thử các việc ở phần “Thử trong 2 tuần”.</div>';
else if(r.a>=.65&&r.i<.4)gapNote='<div class="note">Em làm khá tốt các việc của nhóm này nhưng chưa thật thích. Hãy tự hỏi: em có muốn làm việc này cả đời không?</div>';
s+='<article class="card"><span class="rk '+rk[0]+'">'+(idx+1)+'. '+rk[1]+'</span><h2 style="margin-top:8px">'+g.n+'</h2><p>'+g.d+'</p>'+bar('Sở thích khớp',r.i)+bar('Năng lực khớp',r.a)+(r.s!==null?bar('Môn em thích',r.s):'')+gapNote+
'<h3>Nghề cụ thể</h3><p>'+g.jobs+'</p><h3>Môn nên chú ý từ lớp 10</h3><p>'+g.subj+' <span class="mut sm">(gợi ý; ngành nào xét tổ hợp nào còn tùy trường)</span></p>'+
'<h3>Xu hướng của nhóm này</h3><ul class="l">'+g.tr.map(function(t){return '<li>'+esc(t[0])+' <span class="tag">'+esc(t[1])+'</span></li>';}).join('')+'</ul>'+
'<h3>Để em hình dung mức cạnh tranh năm 2026</h3><p class="sm">'+esc(g.ex)+' <span class="mut">(điểm chuẩn thi tốt nghiệp, thang 30; chỉ để hình dung, không phải mục tiêu của lớp 10)</span></p>'+
'<h3>Thử trong 2 tuần</h3><ul class="l">'+g.t.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></article>';});
s+='<details class="card"><summary>Xem mức hợp của cả 9 nhóm</summary>'+R.map(function(r){return bar(r.g.n,r.t);}).join('')+'</details>';
var txt='La bàn nghề nghiệp. Sở thích nổi bật: '+top2(C.I,TN)+'. Năng lực tự thấy mạnh: '+top2(C.A,AN)+'. Nhóm gợi ý: '+R.slice(0,3).map(function(r){return r.g.n;}).join('; ')+'.';
s+='<div class="card"><h2>Em làm gì tiếp?</h2><ul class="l"><li>Chọn <b>một</b> nhóm em thấy tò mò nhất, làm một việc trong “Thử trong 2 tuần”.</li><li>Hỏi một người đang làm nghề đó: điều khó nhất và điều vui nhất là gì?</li><li>Làm lại bài này sau 6 tháng và so sánh.</li></ul><label for="tx" class="sm mut">Kết quả dạng chữ để em chụp hoặc sao chép:</label><textarea id="tx" readonly>'+esc(txt)+'</textarea></div>';
s+='<div class="card"><h3>Cách tính và nguồn</h3><p class="sm mut">Sở thích dựa trên 6 nhóm sở thích nghề nghiệp phổ biến (thực hành, tìm tòi, sáng tạo, giúp đỡ, dẫn dắt, tổ chức). Mức hợp = 50% sở thích, 30% năng lực, 20% môn học em thích (nếu em chọn). Cách ghép nhóm ngành với sở thích và năng lực là sự sắp xếp của người soạn, chưa được kiểm định khoa học; em dùng để khám phá. Thông tin xu hướng lấy từ báo và các bài tổng hợp, nhiều con số là dự báo và có thể thay đổi; khi em ra trường (khoảng 2033) thị trường sẽ khác. Em kiểm lại với thầy cô và nguồn chính thức. Điểm chuẩn 2026 lấy từ Thanh Niên, Tiền Phong, VOV, VnExpress, VietNamNet, SGGP.</p></div>';
s+='<div class="nav"><button class="btn ghost" id="redo" type="button">Làm lại từ đầu</button></div>';return s;}
function render(){var app=document.getElementById('app'),s='',st=ST.step;
if(st===0){s='<h1>La bàn nghề nghiệp</h1><p class="mut">Em hợp với nhóm ngành nào, và nhóm đó đang có xu hướng ra sao?</p><div class="card"><p>Bài này giúp em hiểu <b>sở thích</b> và <b>năng lực</b> của mình, rồi gợi ý các nhóm ngành và nghề phù hợp, kèm xu hướng của từng nhóm.</p><ul class="l"><li>Khoảng 5 phút, 32 câu, không có đáp án đúng sai.</li><li>Không cần điểm số. Em trả lời theo cảm nhận của mình.</li><li>Kết quả chỉ là gợi ý để khám phá, không phải lời kết luận.</li></ul><div class="nav"><button class="btn" id="start" type="button">Bắt đầu</button></div></div>';}
else if(st>=1&&st<=4){var pct=Math.round((st-1)/5*100);s='<div class="sm mut">Bước '+st+' / 5</div><div class="prog" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><div style="width:'+pct+'%"></div></div>'+qHtml(st)+(ST.miss?'<div class="err" role="alert">Em còn câu chưa trả lời (viền đỏ).</div>':'')+'<div class="nav">'+(st>1?'<button class="btn ghost" id="back" type="button">Quay lại</button>':'')+'<button class="btn" id="next" type="button">Tiếp tục</button></div>';}
else if(st===5){s='<div class="sm mut">Bước 5 / 5</div><div class="prog"><div style="width:80%"></div></div><h2>Em thích học môn nào nhất?</h2><p class="mut sm">Chọn tối đa 3 môn em thấy hứng thú nhất (không cần là môn em giỏi nhất). Em có thể bỏ qua bước này.</p><div class="subj" id="sb">'+SUBJ.map(function(x){var on=ST.s.indexOf(x)>-1;return '<label><input type="checkbox" value="'+esc(x)+'"'+(on?' checked':'')+(!on&&ST.s.length>=3?' disabled':'')+'><span>'+esc(x)+'</span></label>';}).join('')+'</div><div class="nav"><button class="btn ghost" id="back" type="button">Quay lại</button><button class="btn" id="next" type="button">Xem kết quả</button></div>';}
else s=resultHtml();
app.innerHTML=s;window.scrollTo(0,0);}
function init(){load();var app=document.getElementById('app');
app.addEventListener('change',function(e){var t=e.target;if(t.type==='radio'){ST.a[t.name]=parseInt(t.value);save();var f=t.closest('fieldset');if(f)f.classList.remove('miss');}
else if(t.type==='checkbox'){var v=t.value,i=ST.s.indexOf(v);if(t.checked&&i<0&&ST.s.length<3)ST.s.push(v);else if(!t.checked&&i>-1)ST.s.splice(i,1);save();var bx=document.querySelectorAll('#sb input');for(var k=0;k<bx.length;k++){bx[k].disabled=ST.s.length>=3&&ST.s.indexOf(bx[k].value)<0;bx[k].checked=ST.s.indexOf(bx[k].value)>-1;}}});
app.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.id==='start'){ST.step=1;render();}
else if(b.id==='back'){ST.step=Math.max(0,ST.step-1);ST.miss=false;render();}
else if(b.id==='next'){if(!stepOk(ST.step)){ST.miss=true;render();var m=document.querySelector('fieldset.miss');if(m)m.scrollIntoView({block:'center'});return;}ST.miss=false;ST.step++;render();}
else if(b.id==='redo'){ST.a={};ST.s=[];save();ST.step=0;render();}});
render();}
init();
</script>
